version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      "dependencias-produccion":
        patterns:
          - "*"
    open-pull-requests-limit: 10
    labels:
      - "seguridad"
      - "dependencias"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
