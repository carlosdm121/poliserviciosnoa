name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || 'https://localhost:3000' }}
  DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
  PHONE_HASH_PEPPER: ${{ secrets.PHONE_HASH_PEPPER }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  CSP_REPORT_ONLY: '1'

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks escanea el rango before^..after del push: sin historial
          # completo git no puede resolver el padre y el paso falla.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      - name: Build de Next.js
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
          NEXTAUTH_SECRET: "dummy_secret_key_genera_una_larga_de_prueba"
          RESEND_API_KEY: "re_dummy_key"
          MP_ACCESS_TOKEN: "TEST-dummy-token"
          MP_WEBHOOK_SECRET: "dummy_webhook_secret"
          CLOUDINARY_CLOUD_NAME: "dummy_cloud"
          CLOUDINARY_API_KEY: "123456789"
          CLOUDINARY_API_SECRET: "dummy_secret"
          UPSTASH_REDIS_REST_URL: "https://dummy-redis.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "dummy_token"
          PHONE_HASH_PEPPER: "0123456789abcdef0123456789abcdef"
          DATA_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CRON_SECRET: "dummy_cron_secret"
        run: npm run build

      - name: Escanear secretos en bundle del cliente (punto 1)
        run: npx tsx scripts/check-client-bundle.ts

      - name: Verificar que no haya queries no seguras (punto 13)
        run: npx tsx scripts/check-no-unsafe-queries.ts

      - name: Auditar dependencias (punto 20)
        run: npm audit || true

      - name: Escanear secretos en el repositorio con gitleaks (puntos 1 y 2)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Escanear dependencias con OSV-Scanner (punto 20)
        run: |
          mkdir -p ./bin
          curl -sSfL -o ./bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          chmod +x ./bin/osv-scanner
          ./bin/osv-scanner scan -L package-lock.json

      - name: Ejecutar verificar (seed idempotente + flujos)
        run: npm run verificar
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/poliservicios_test
          NEXTAUTH_SECRET: "dummy_secret_key_genera_una_larga_de_prueba"
          RESEND_API_KEY: "re_dummy_key"
          MP_ACCESS_TOKEN: "TEST-dummy-token"
          MP_WEBHOOK_SECRET: "dummy_webhook_secret"
          CLOUDINARY_CLOUD_NAME: "dummy_cloud"
          CLOUDINARY_API_KEY: "123456789"
          CLOUDINARY_API_SECRET: "dummy_secret"
          UPSTASH_REDIS_REST_URL: "https://dummy-redis.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "dummy_token"
          PHONE_HASH_PEPPER: "0123456789abcdef0123456789abcdef"
          DATA_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CRON_SECRET: "dummy_cron_secret"
